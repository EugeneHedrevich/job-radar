# SAP Job Radar - scoring configuration.
#
# Everything the deterministic matcher does is driven by this file. The LLM
# stage reuses the same weights so both engines are comparable.
#
# The output is a FIT SCORE (0-100): how well the vacancy matches the profile.
# It is NOT a probability of being hired.

version: "2026-10-13.2"

# Final score = sum(dimension score x weight). Weights must sum to 1.0.
weights:
  technical: 0.55
  commercial: 0.20
  location: 0.25

thresholds:
  apply: 75 # >= -> recommendation "Apply"
  review: 55 # >= -> recommendation "Review"; below -> "Skip"
  # Jobs that pass the LLM screen gate are sent to the LLM (stage 2).
  llm_screen_gate: 45

# Unknown facts must not silently become a yes or a no.
# Missing facts are recorded in `missingInformation`.
uncertainty:
  # A job whose description was never retrieved can never be recommended
  # "Apply" by the deterministic engine, only "Review".
  cap_without_description: 70
  # Likewise an LLM assessment is never produced without a description.
  require_description_for_llm: true

technical:
  # Points per matched skill group, capped at `cap`. Matching is
  # case-insensitive on word boundaries against title + description.
  groups:
    core: { points_per_hit: 14, cap: 42 }
    integration: { points_per_hit: 10, cap: 30 }
    frontend: { points_per_hit: 8, cap: 16 }
    data: { points_per_hit: 7, cap: 21 }
    platform: { points_per_hit: 6, cap: 18 }
    ai: { points_per_hit: 9, cap: 27 }
  # A focused frontend role is assessed against its own skill set. Unrequested
  # CAP/Node.js/BTP skills must not be needed to clear the Apply threshold.
  # This only uses skills actually held in the profile and found in a full ad.
  role_profiles:
    ui5:
      label: "SAPUI5 frontend"
      title_any: ["\\b(?:sapui5|ui5|fiori)\\b"]
      title_none: ["\\b(?:abap|rap|btp|capm?|cpi|basis)\\b"]
      required_skills: ["SAPUI5"]
      min_matches: 3
      skills:
        "SAPUI5": 40
        "SAP Fiori": 15
        "JavaScript": 15
        "TypeScript": 10
        "OData": 10
        "REST": 10
  # A title hit is worth this multiplier on top of a description hit.
  title_multiplier: 1.5
  # Floor applied when the title clearly names an SAP BTP-family role.
  relevant_title_floor: 45
  max: 100

commercial:
  # Contract/freelance signals.
  contract_signals_bonus: 25
  permanent_signals_penalty: 35
  # Rate handling. Unknown rate -> neutral, never a reject.
  rate_at_or_above_target_bonus: 20
  rate_below_minimum_penalty: 45
  base: 50
  max: 100

location:
  base: 50
  fully_remote_bonus: 35
  remote_within_europe_bonus: 10
  hybrid_penalty: 20
  onsite_penalty: 40
  outside_preferred_region_penalty: 25
  preferred_country_bonus: 10
  max: 100

# Mandatory incompatibilities. A hard reject forces recommendation "Skip" and a
# score cap, regardless of how well the job scores elsewhere.
hard_rejects:
  score_cap: 25
  rules:
    - id: permanent_only
      reason: "Permanent employment only; profile is freelance/B2B/contract."
      # Explicit employment-only statements are not contract offers.
      any:
        - "permanent (position|role|contract|employment) only"
        - "(only|exclusively) (direct hire|festanstellung|unbefristet)"
      none: []

    - id: contract_excluded
      reason: "Freelance/contract engagement is explicitly excluded."
      any:
        - "\\bno (freelancers?|contractors?|b2b|c2c)\\b"
        - "\\b(freelancers?|contractors?|b2b|c2c) (are )?(not|won't be) (considered|accepted|allowed)\\b"
        - "\\bkeine (freiberufler|freelancer)\\b"
      none: []

    - id: abap_only
      reason: "ABAP-centric development role; profile does not claim ABAP development."
      any:
        - "abap (developer|consultant|programmer)"
        - "senior abap"
        - "(^|\\W)rap (framework|model)? ?(developer|expert|specialist)"
        - "abap oo"
        - "(expert|strong|extensive|deep) (knowledge|experience) (in|of|with) abap"
      none:
        - "btp"
        - "cap(m)?\\b"
        - "cloud application programming"
        - "node\\.?js"
        - "typescript"
        - "ui5"
        - "fiori"
        - "integration suite"

    - id: functional_only
      reason: "Predominantly functional role; profile is technical/development."
      any:
        - "functional (consultant|analyst|lead)"
        - "(fi/co|sd/mm|mm/sd|is-u|isu|ewm|hcm|successfactors) consultant"
        - "business process (consultant|expert)"
        - "customizing (consultant|expert)"
      none:
        - "develop(er|ment)"
        - "btp"
        - "cap(m)?\\b"
        - "node\\.?js"
        - "ui5"
        - "fiori"
        - "integration suite"

    - id: onsite_heavy
      reason: "Heavily onsite; profile accepts only occasional travel."
      # Checked in the same local attendance context as travel_limit.
      # Numeric schedules use the profile's monthly travel limit, not a fixed regex.
      any:
        - "(100|full)\\s*%\\s*(on[- ]?site|onsite|vor ort)"
        - "fully on[- ]?site"
        - "no remote (work)?( possible| allowed)?"
        - "remote (work )?is not (possible|an option|offered)"
        - "must relocate"
        - "relocation (is )?(required|mandatory)"
      none: []

# Cheap stage-1 screening. Jobs failing this never reach the LLM.
prescreen:
  # At least one of these must appear in the title or description.
  require_any:
    - "\\bsap\\b"
    - "\\bsapui5\\b"
    - "s/?4 ?hana"
    - "\\bbtp\\b"
    - "\\babap\\b"
    - "\\bfiori\\b"
    - "\\bui5\\b"
  # If the title contains any of these and none of `rescue_terms`, drop early.
  drop_title_terms:
    - "abap"
    - "basis administrator"
    - "sales"
    - "account executive"
    - "recruiter"
    - "intern(ship)?"
    - "working student"
    - "werkstudent"
    - "praktikum"
  rescue_terms:
    - "btp"
    - "cap"
    - "capm"
    - "cpi"
    - "integration suite"
    - "ui5"
    - "fiori"
    - "cloud"
    - "joule"

# Applies before NEW automatic records are saved, and to the default saved view.
# These are role families, not generic words such as CAP, AI or cloud.
relevance:
  target_role_families:
    cap: ['\bsap\s+(?:capm?|cloud application programming model)\b', '\bcloud application programming model\b']
    ui5: ['\b(?:sap\s*ui5|ui5|openui5|fiori(?: elements)?)\b']
    btp: ['\b(?:sap\s+btp|business technology platform)\b', '\bsap\b.*\b(?:btp|work\s?zone)\b']
    ai: ['\b(?:sap\s+(?:joule|business ai|ai core|ai (?:developer|architect|engineer)|generative ai hub)|joule(?: studio)?)\b']
    integration: ['\b(?:sap\s+(?:cpi|hci|integration (?:suite|expert|developer|architect|engineer|specialist|consultant)|integratie consultant|integrationsberater\w*)|cloud platform integration|integration suite)\b']
  hard_title_exclusions:
    Internship, student or apprenticeship:
      - '\b(?:intern(?:ship)?|working[- ]student|student assistant|werkstudent\w*|praktik\w*|auszubild\w*|apprentice\w*)\b'
    Unrelated finance, sales or administration:
      - '\b(?:recruiter|account executive|sales (?:manager|executive)|financial (?:controller|analyst)|accountant|buchhalter\w*|finance manager|administrative assistant|office administrator)\b'
      - '\b(?:finance|financial|administrative)\s+(?:administrator|assistant|officer|specialist)\b'
      - '\b(?:finance|financial|fi/co|fi[- ]co)\s+(?:functional\s+)?consultant\b'
    Functional-only SAP role:
      - '^(?!.*\b(?:btp|capm?|cpi|ui5|fiori|integration|integratie|technical|technisch\w*|develop\w*|entwickl\w*)\b).*\bsap\s+(?:fi(?:[-/ ]co)?|co|pp|qm|sd|mm|hcm|payroll)\b.*\b(?:consultant|berater)\b'
      - '^(?!.*\b(?:btp|capm?|cpi|ui5|fiori|integration|integratie)\b).*\bsap\s+(?:fi/?co|fi[- ]co|sd/mm|payroll)\s+(?:functional\s+)?(?:consultant|berater)\b'

# These technologies are not claimed absent: requirements need profile confirmation.
# Keep aliases here so a known CPI skill in the same sentence cannot hide them.
requirement_capabilities:
  Commerce Cloud: ['SAP Commerce Cloud', 'Commerce Cloud', 'Hybris']
  Salesforce: ['Salesforce', 'Salesforce CRM']
  EDI: ['EDI', 'Electronic Data Interchange', 'EDIFACT']

# Phrases used to detect contract vs permanent and remote vs onsite when the
# structured fields from the source are missing.
signals:
  contract:
    - "freelance"
    - "freelancer"
    - "contract(or|ing)?\\b"
    - '\bb2b\s+(?:contract|engagement|employment|cooperation|basis|agreement)\b'
    - '\b(?:on|via|under)\s+(?:a\s+)?b2b\b'
    - '\b(?:contract type|employment|engagement|umowa|cooperation)\s*:?\s*b2b\b'
    - "interim"
    - "self[- ]employed"
    - "day rate"
    - "daily rate"
    - "hourly rate"
    - "tagessatz"
    - "werkvertrag"
    - "outside ir35"
  permanent:
    - '\bpermanent\s+(?:position|role|contract|employment|job|employee)\b'
    - "festanstellung"
    - '\bunbefristet\w*\b'
    - "full[- ]time employee"
    - "cdi\\b"
    - '\b(?:on (?:the |our )?payroll|payroll employment)\b'
    - '\b(?:contract(?: type)?|type|employment(?: type)?)\s*:\s*permanent\b'
    - "annual salary"
    - "13th salary"
  fully_remote:
    - '\b(?:location|work(?:ing)? mode|workplace)\s*:\s*remote\b'
    - "fully remote"
    - "100\\s*%\\s*remote"
    - "remote[- ]first"
    - "work from anywhere"
    - "remote \\(europe\\)"
    - "remote within (the )?(eu|europe|eea)"
  hybrid:
    - "hybrid"
    - "\\d\\s*days? (a|per) week (in (the )?office|on[- ]?site)"
    - "partially remote"
    - '\b(?:hybrides? arbeiten|teilweise (?:remote|homeoffice))\b'
  homeoffice:
    - '\b(?:homeoffice|home[- ]office|mobil\w* arbeiten|mobile[- ]working|remote[- ]working)\b'
  remote_weekly_limits:
    - '(?:max\.?|maximal|bis zu|hochstens)\s*(\d+(?:\.\d+)?)\s*tage?\s*(?:pro|je|/)\s*woche\b'
    - '(?:maximum|max\.?|at most|up to)\s*(\d+(?:\.\d+)?)\s*days?\s*(?:per|a|/)\s*week\b'
  technical_contract_context:
    - '\b(?:contract[- ]testing|contract[- ]tests?|smart contracts?|api contracts?)\b'
    - '\b(?:integrat\w*|edi|a2a|b2g|interface\w*|schnittstell\w*|kunden|lieferanten|customer|supplier|smart contract\w*)\b'
  employment_context:
    - '\b(?:employment|engagement|freelanc\w*|contractor|day rate|hourly rate|tagessatz|vergutung|anstellung|arbeitsvertrag|cooperation|basis)\b'
  employment_alternatives:
    - '\b(?:permanent\s*(?:employment|roles?|positions?)?\s*(?:or|oder|/)\s*(?:contract|freelance)|(?:contract|freelance)\s*(?:or|oder|/)\s*permanent)\b'
  onsite:
    - "on[- ]?site"
    - "vor ort"
    - "in[- ]office"
  mandatory_markers:
    - "must have"
    - "required"
    - "\\b(?:requires?|must|compulsory|obligatory)\\b"
    - "mandatory"
    - "essential"
    - "is a must"
    - "minimum requirement"
    - "\\bwymagan(?:e|a|y)\\b"
    - "bardzo dobra znajomosc"
    - "\\b(?:erforderlich|zwingend|unverzichtbar)\\b"
    - "\\b(?:obligatoire|requis|indispensable|vereist)\\b"
  preferred_markers:
    - "nice[- ]to[- ]haves?"
    - "preferred"
    - "a plus"
    - "beneficial"
    - "desirable"
    - "would be an advantage"
    - "mile widzian(?:e|a|y)\\b"
    - "(?:dodatkowym )?atutem"
    - "\\b(?:wunschenswert|von vorteil|souhaite|souhaitee|wenselijk)\\b"
  mandatory_sections:
    - "^(?:requirements|qualifications|candidate profile|your profile|what you bring)$"
    - "^(?:key )?responsibilities (?:&|and) requirements$"
    - "^(?:profil kandydata|(?:nasze )?wymagania|oczekiwania)$"
    - "^(?:profil|(?:dein|ihr) profil|anforderungen|qualifikationen)$"
    - '^(?:das bringst du mit|was du mitbringst|das zeichnet dich aus|was dich auszeichnet|deine qualifikationen)$'
    - "^(?:profil recherche|votre profil|jouw profiel|functie-eisen)$"
  preferred_sections:
    - "^(?:nice[- ]to[- ]haves?|preferred (?:skills|qualifications)|desirable skills)$"
    - "^(?:mile widziane|dodatkowe atuty|wunschenswert|von vorteil)$"
  non_requirement_sections:
    - "^(?:responsibilities|(?:your |the )?role|job description|about (?:us|the (?:company|client))|(?:what )?we offer|benefits)$"
    - "^(?:opis stanowiska|zakres obowiazkow|o naszym kliencie|oferujemy)$"
    - "^(?:aufgaben|(?:deine|ihre) aufgaben|wir bieten|vorteile)$"
    - '^(?:was dich erwartet|das bieten wir dir|deine aufgaben bei uns im team|dein ansprechpartner)$'
    - "^(?:missions|vos missions|nous offrons|avantages|aanbod|wij bieden)$"

