# SAP Job Radar - collection configuration.
#
# Geography is configured PER SOURCE on purpose:
#   * LinkedIn searches globally and understands only `location` (free text).
#   * Indeed and Glassdoor REQUIRE `country_indeed`; `location` only narrows it.
#   * Glassdoor supports a smaller country list than Indeed.
#   * SAP agencies use their public searches; `all` preserves the location
#     stated by each vacancy rather than assuming a country or remote access.
# JobSpy sources verified against python-jobspy 1.2.0.

defaults:
  hours_old: 120 # freshness window; deliberately wider than the 3h cycle so
                # cycles overlap and nothing is lost to a failed run
  results_wanted: 25
  description_format: markdown
  distance: 50
  job_type: null # do NOT pre-filter on contract: most postings omit this field
  is_remote: false # do NOT pre-filter on remote: most postings omit this field

# Task counts are not HTTP request counts: each search can paginate.
linkedin_limits:
  max_search_tasks_per_run: 2
  max_detail_requests_per_run: 5 # includes redirects, across both description slots
  max_search_requests_per_task: 3
  # Shared across scheduler, CLI, dashboard and imports; clicking again cannot reset them.
  window_minutes: 180
  max_search_requests_per_window: 6
  max_detail_requests_per_window: 5

# Widen selected searches without allocating additional tasks or HTTP requests.
coverage:
  catch_up_hours: 72
  older_scan_every: 6
  older_scan_hours: 720

# Reference catalogue; actual execution is defined by rotation.batches below.
keywords:
  - "SAP BTP Developer"
  - "SAP CPI Developer"
  - "SAP Integration Suite Developer"
  - "SAP BTP Architect"
  - "SAP CAP"
  - "SAP CAPM"
  - "SAP Cloud Application Programming Model"
  - "SAPUI5"
  - "SAP UI5"
  - "SAP Joule"
  - "Joule Studio"
  - "SAP Joule Developer"
  - "SAP Business AI"
  - "SAP AI Core"
  - "SAP CAP Developer"
  - "SAP CAPM Consultant"
  - "SAP Cloud Application Programming Model Architect"
  - "SAP Fiori"
  - "Fiori Elements"
  - "SAPUI5 Developer"
  - "SAP UI5 Developer"
  - "SAP Fiori Developer"
  - "SAP Joule Consultant"
  - "Joule Studio Developer"
  - "SAP Joule Architect"
  - "SAP Generative AI Hub"
  - "SAP BTP AI"
  - "SAP AI Core Developer"
  - "SAP CAP freelance"
  - "SAP CAPM contract"
  - "SAP CAP B2B"
  - "SAP Fiori Consultant"
  - "Fiori Elements Architect"
  - "SAP Joule freelance"
  - "Joule Studio contract"
  - "SAP Joule B2B"
  - "SAP Business AI Consultant"
  - "SAP Generative AI Hub Architect"
  - "SAPUI5 freelance"
  - "SAP Fiori contract"
  - "Fiori Elements B2B"
  - "SAP Business AI freelance"
  - "SAP BTP AI contract"
  - "SAP AI Core B2B"

sources:
  linkedin:
    enabled: true
    queries:
      syntax: linkedin
      exact_phrases: true
      exclusions: [internship, working student, Werkstudent, Praktikum]
      roles: {} # broad skills stay broad; explicit Developer keywords still run
      # Optional: geos: [eu, de, bg]; employment: contract; remote_only: true.
      # Leave filters unset to retain adverts with missing/coarse source fields.
    # Equivalent query/geography combinations share one catalogue entry.
    # These share bounded slots per sequence before cooldowns/shared limits.
    # The catalogue rotates fairly; actual first-page coverage is diagnostic,
    # not guaranteed. Keep a wider window for this deliberately slower source.
    hours_old: 168
    # LinkedIn ignores country_indeed. Only free-text `location` works.
    geos:
      eu: { id: eu, location: "European Union" }
      de: { id: de, location: "Germany" }
      nl: { id: nl, location: "Netherlands" }
      ch: { id: ch, location: "Switzerland" }
      bg: { id: bg, location: "Bulgaria" }
      uk: { id: uk, location: "United Kingdom" }
      emea: { id: emea, location: "EMEA" }
      europe: { id: europe, location: "Europe" }
      middle-east: { id: middle-east, location: "Middle East" }
      africa: { id: africa, location: "Africa" }
      ae: { id: ae, location: "United Arab Emirates" }
      dubai: { id: dubai, location: "Dubai, United Arab Emirates" }
    results_wanted: 25
    # LinkedIn rate limits aggressively; keep requests slow and few.
    delay_between_tasks_seconds: 8
    task_timeout_seconds: 240
    supports_description_fetch: true
    search_results_include_description: false
    supports_backlog_enrichment: true

  indeed:
    enabled: true
    queries:
      syntax: indeed
      exact_phrases: true
      exclusions: [internship, working student, Werkstudent, Praktikum]
      roles: {}
    # country_indeed is mandatory and must use JobSpy's exact spelling.
    geos:
      de: { id: de, country_indeed: "Germany", location: "Germany" }
      nl: { id: nl, country_indeed: "Netherlands", location: "Netherlands" }
      ch: { id: ch, country_indeed: "Switzerland", location: "Switzerland" }
      at: { id: at, country_indeed: "Austria", location: "Austria" }
      pl: { id: pl, country_indeed: "Poland", location: "Poland" }
      uk: { id: uk, country_indeed: "UK", location: "United Kingdom" }
      ie: { id: ie, country_indeed: "Ireland", location: "Ireland" }
      ae: { id: ae, country_indeed: "United Arab Emirates", location: "United Arab Emirates" }
      dubai: { id: dubai, country_indeed: "United Arab Emirates", location: "Dubai" }
      za: { id: za, country_indeed: "South Africa", location: "South Africa" }
      eg: { id: eg, country_indeed: "Egypt", location: "Egypt" }
    results_wanted: 30
    delay_between_tasks_seconds: 2
    task_timeout_seconds: 180
    supports_description_fetch: true
    # Indeed already returns descriptions in search results.
    search_results_include_description: true

  glassdoor:
    enabled: true
    queries: { syntax: plain, roles: {} }
    # Only countries marked with * in the JobSpy README support Glassdoor.
    geos:
      de: { id: de, country_indeed: "Germany", location: "Germany" }
      nl: { id: nl, country_indeed: "Netherlands", location: "Netherlands" }
      ch: { id: ch, country_indeed: "Switzerland", location: "Switzerland" }
      at: { id: at, country_indeed: "Austria", location: "Austria" }
      uk: { id: uk, country_indeed: "UK", location: "United Kingdom" }
      ie: { id: ie, country_indeed: "Ireland", location: "Ireland" }
    results_wanted: 20
    # Glassdoor blocks after roughly 30 requests per IP.
    delay_between_tasks_seconds: 6
    task_timeout_seconds: 180
    supports_description_fetch: true
    search_results_include_description: false

  redglobal:
    enabled: true
    geos:
      all: { id: all }
    results_wanted: 5
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 180
    supports_description_fetch: true
    search_results_include_description: false
    supports_backlog_enrichment: true

  eursap:
    enabled: true
    geos:
      all: { id: all }
    results_wanted: 5
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 180
    supports_description_fetch: true
    search_results_include_description: false
    supports_backlog_enrichment: true

  whitehall:
    enabled: true
    geos:
      all: { id: all }
    results_wanted: 5
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 180
    supports_description_fetch: true
    search_results_include_description: false
    supports_backlog_enrichment: true

  michaelpage:
    enabled: true
    geos:
      pl: { id: pl, location: "Poland" }
      de: { id: de, location: "Germany" }
      nl: { id: nl, location: "Netherlands" }
      uk: { id: uk, location: "United Kingdom" }
      ch: { id: ch, location: "Switzerland" }
      fr: { id: fr, location: "France" }
      ae: { id: ae, location: "United Arab Emirates" }
    # Recruiters keep active adverts for weeks; retain the actual posting date.
    hours_old: 2160
    results_wanted: 25
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 240
    supports_description_fetch: true
    search_results_include_description: false
    supports_backlog_enrichment: true

  nextventures:
    enabled: true
    geos:
      all: { id: all }
    hours_old: 2160
    results_wanted: 25
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 240
    supports_description_fetch: true
    search_results_include_description: false
    supports_backlog_enrichment: true

  remotive:
    enabled: true
    geos:
      all: { id: all }
    results_wanted: 25
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 180
    search_results_include_description: true
    supports_description_fetch: true
    supports_backlog_enrichment: true

  arbeitnow:
    enabled: true
    geos:
      all: { id: all }
    results_wanted: 25
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 180
    search_results_include_description: true
    supports_description_fetch: true
    supports_backlog_enrichment: true

  remoteok:
    enabled: true
    geos:
      all: { id: all }
    results_wanted: 25
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 180
    search_results_include_description: true
    supports_description_fetch: true
    supports_backlog_enrichment: true

  jobicy:
    enabled: true
    geos:
      all: { id: all }
    results_wanted: 25
    delay_between_tasks_seconds: 3
    task_timeout_seconds: 180
    search_results_include_description: true
    supports_description_fetch: true
    supports_backlog_enrichment: true

# Priority batches interleave four directions across the original six sources.
# Public catalogue scans cover six more providers, including seven Michael Page markets.
# Each uses at most 3 queries x 6 geographies = 18 tasks, without tail truncation.
# Broad priority and catalogue scans recur every 36h; the 36-slot sequence
# takes 108h at the current schedule, inside the 120h board freshness window.
rotation:
  interval_hours: 3
  sequence:
    - cap-broad
    - ui5-broad
    - joule-broad
    - btp-ai-broad
    - sap-public
    - cap-markets
    - cap-roles
    - ui5-fiori
    - joule-roles
    - btp-ai-hub
    - cap-contracts
    - emea-frontend
    - cap-broad
    - ui5-broad
    - joule-broad
    - btp-ai-broad
    - sap-public
    - joule-markets
    - ui5-roles
    - joule-contracts
    - btp-ai-roles
    - ui5-contracts
    - btp-ai-contracts
    - emea-core
    - cap-broad
    - ui5-broad
    - joule-broad
    - btp-ai-broad
    - sap-public
    - btp-markets
    - btp-core
    - integration
    - frontend
    - architect-ai
    - sap-specialists
    - uae-frontend
  batches:
    - key: "cap-broad"
      keywords: ["SAP CAP", "SAP CAPM", "SAP Cloud Application Programming Model"]
      targets: &priority_targets
        linkedin: [eu]
        indeed: [nl]
        glassdoor: [nl]
        redglobal: [all]
        eursap: [all]
        whitehall: [all]
    - key: "ui5-broad"
      keywords: ["SAPUI5", "SAP UI5"]
      # Search individual markets as well as the capped EU result set.
      targets:
        linkedin: [eu, de, nl]
        indeed: [de, pl]
        glassdoor: [de]
        redglobal: [all]
        eursap: [all]
        whitehall: [all]
    - key: "joule-broad"
      keywords: ["SAP Joule", "Joule Studio", "SAP Joule Developer"]
      targets: *priority_targets
    - key: "btp-ai-broad"
      keywords: ["SAP Business AI", "SAP AI Core"]
      targets: *priority_targets
    - key: "cap-roles"
      keywords: ["SAP CAP Developer", "SAP CAPM Consultant", "SAP Cloud Application Programming Model Architect"]
      targets: *priority_targets
    - key: "ui5-fiori"
      keywords: ["SAP Fiori", "Fiori Elements", "SAPUI5 Developer"]
      targets: *priority_targets
    - key: "joule-roles"
      keywords: ["SAP Joule Consultant", "Joule Studio Developer", "SAP Joule Architect"]
      targets: *priority_targets
    - key: "btp-ai-hub"
      keywords: ["SAP Generative AI Hub", "SAP BTP AI", "SAP AI Core Developer"]
      targets: *priority_targets
    - key: "cap-contracts"
      keywords: ["SAP CAP freelance", "SAP CAPM contract", "SAP CAP B2B"]
      targets: *priority_targets
    - key: "ui5-roles"
      keywords: ["SAP Fiori Consultant", "Fiori Elements Architect"]
      targets: *priority_targets
    - key: "joule-contracts"
      keywords: ["SAP Joule freelance", "Joule Studio contract", "SAP Joule B2B"]
      targets: *priority_targets
    - key: "btp-ai-roles"
      keywords: ["SAP Business AI Consultant", "SAP Generative AI Hub Architect"]
      targets: *priority_targets
    - key: "ui5-contracts"
      keywords: ["SAPUI5 freelance", "SAP Fiori contract", "Fiori Elements B2B"]
      targets: *priority_targets
    - key: "btp-ai-contracts"
      keywords: ["SAP Business AI freelance", "SAP BTP AI contract", "SAP AI Core B2B"]
      targets: *priority_targets

    # Separate market batches cover the tail within 18 tasks per cycle.
    # Keep the original Dutch searches and public global agency catalogues.
    - key: "cap-markets"
      keywords: ["SAP CAP", "SAP CAPM", "SAP Cloud Application Programming Model"]
      targets:
        indeed: [de, ch, uk, pl, at, ie]
    - key: "joule-markets"
      keywords: ["SAP Joule", "Joule Studio", "SAP Joule Developer"]
      targets:
        indeed: [de, ch, uk]
        glassdoor: [de, ch, uk]
    - key: "btp-markets"
      keywords: ["SAP BTP", "SAP Business AI", "SAP AI Core"]
      targets:
        indeed: [de, ch, uk, pl, at, ie]

    - key: "btp-core"
      keywords: ["SAP BTP Developer", "SAP CAP Developer", "SAP CAPM Developer"]
      targets:
        linkedin: [eu, de]
        indeed: [de, nl]
        glassdoor: [de]

    - key: "integration"
      keywords: ["SAP CPI Developer", "SAP Integration Suite Developer"]
      targets:
        linkedin: [eu, nl]
        indeed: [de, ch, at]
        glassdoor: [nl]

    - key: "frontend"
      keywords: ["SAPUI5 Developer", "SAP UI5 Developer", "SAP Fiori Developer"]
      targets:
        linkedin: [de, ch, bg]
        indeed: [de, pl]
        glassdoor: [ch]

    - key: "architect-ai"
      keywords: ["SAP BTP Architect", "SAP AI Developer"]
      targets:
        linkedin: [eu, uk]
        indeed: [uk, ie, nl]
        glassdoor: [uk, ie]

    # Agency searches use skill names: a BTP Consultant should not be lost
    # just because the search term ends with "Developer".
    - key: "sap-specialists"
      keywords: ["BTP", "CAP", "CPI", "UI5", "Fiori"]
      targets:
        redglobal: [all]
        eursap: [all]
        whitehall: [all]

    # Wide SAP searches include functional and technical roles; matching still
    # applies the profile after collection. One task per public catalogue/market.
    - key: "sap-public"
      keywords: ["SAP"]
      targets:
        michaelpage: [pl, de, nl, uk, ch, fr, ae]
        nextventures: [all]
        remotive: [all]
        arbeitnow: [all]
        remoteok: [all]
        jobicy: [all]

    # Broad region searches complement capped country results. UAE endpoints
    # use their actual country value; Glassdoor does not support UAE.
    - key: "emea-frontend"
      keywords: ["SAPUI5", "SAP UI5", "SAP Fiori"]
      targets:
        linkedin: [emea, europe, middle-east, africa, ae, dubai]

    - key: "emea-core"
      keywords: ["SAP BTP", "SAP CAP", "SAP CPI"]
      targets:
        linkedin: [emea, middle-east, africa]
        indeed: [ae, za, eg]

    - key: "uae-frontend"
      keywords: ["SAPUI5 Developer", "SAP UI5 Developer", "SAP Fiori Developer"]
      targets:
        linkedin: [ae, dubai]
        indeed: [ae, dubai]

# Descriptions cost one extra HTTP request per job and are the fastest way to
# get blocked. They are therefore budgeted per run.
# A job collected without a description stays incomplete - it is never given an
# invented assessment.
description_budget:
  max_tasks_per_run: 2
  max_pending_candidates: 40 # hidden cards awaiting SAP context; reuse description slots
  # Global persistent source cursor; independent batch keyword/location cursors.
  # Sources that already ship descriptions in search results are skipped here.
  prefer_sources: ["linkedin", "glassdoor", "redglobal", "eursap", "whitehall", "michaelpage", "nextventures"]

resilience:
  max_tasks_per_run: 18
  max_retries_per_task: 1
  retry_delay_seconds: 20
  # Consecutive failures of a source before it is put on cooldown.
  failure_threshold: 3
  cooldown_minutes:
    rate_limit: 120
    blocked: 720
    timeout: 30
    network: 15
    error: 30
  # Repeated rate-limit cycles double the base delay to this cap;
  # a longer server Retry-After still takes precedence. Recovery resets it.
  max_rate_limit_cooldown_minutes: 2880
  # Overall wall clock budget for the collector subprocess.
  process_timeout_seconds: 1800
